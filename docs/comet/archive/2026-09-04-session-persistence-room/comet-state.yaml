acceptance:
  - id: A1
    source: brief.md
    text: "**A1**：Room flush/load preserves the complete Session event log, derived
      messages, request folds, Inbox replay and pending retry recovery; no JSON
      session file is created."
    result: passed
    reason:
      text: Room header and append-only event rows preserve the complete session event
        log, derived projections, Inbox replay and pending retry recovery; JVM
        verification passed with no JSON session file output.
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2**：Repeated or concurrent flushes are transactional and idempotent;
      `(sessionId, seq)` remains unique and a failed transaction leaves the
      previous committed snapshot readable."
    result: passed
    reason:
      text: Flush captures state under the provider mutex and writes header/tail
        deletion/event upserts inside the SessionDatabaseAccess transaction; the
        composite (session_id, seq) key and repeated/concurrent flush test
        preserve one contiguous snapshot.
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3**：Load repairs an interrupted turn/step exactly once, while a
      pending durable retry defers repair to retry recovery."
    result: passed
    reason:
      text: Open turn repair appends one StepEnd/TurnEnd and is persisted exactly
        once; a pending durable llm-retry defers repair and restart recovery
        resumes correctly.
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4**：Default Host storage uses an independent Harness Room database;
      optional App integration uses only a neutral adapter and never opens two
      RoomDatabase instances against one SQLite file."
    result: passed
    reason:
      text: SessionDatabaseRegistry uses immutable-map CAS Opening/Ready/Closing
        states. Same-factory and cross-factory duplicate creates for one
        location are rejected, close completes before the key is released, and a
        real JVM Room factory test verifies duplicate rejection, close/reopen
        and different-location isolation. The neutral SessionDatabaseAccess
        adapter remains independent from AppDatabase.
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5**：Desktop/Android platform factories own Room builder, driver, query
      context and location; the Plugin only installs the persistence service and
      has no platform or environment lookup."
    result: passed
    reason:
      text: JVM, Android and iOS factories own Room builder, BundledSQLiteDriver,
        Dispatchers.IO and location; the plugin only installs the supplied
        access/service/listener and does not perform platform or environment
        lookup.
      truncated: false
