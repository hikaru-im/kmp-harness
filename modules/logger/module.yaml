apply: [../../kmp.module-template.yaml]

product:
  type: kmp/lib
  platforms: [jvm, android, iosSimulatorArm64, iosArm64]

dependencies:
  - ../loader
  - ../runtime
  - io.github.oshai:kotlin-logging:8.0.4: exported

# kotlin-logging delegates to SLF4J on JVM/Android. This is the API only;
# concrete providers remain an application responsibility.
dependencies@jvm:
  - org.slf4j:slf4j-api:2.0.18

dependencies@android:
  - org.slf4j:slf4j-api:2.0.18
