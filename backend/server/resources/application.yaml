spring:
  application:
    name: yudao-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  cache:
    type: redis
    redis:
      time-to-live: 1h
  http:
    clients:
      reactive:
        connector: jdk

server:
  port: ${SERVER_PORT:48080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: ${KNIFE4J_ENABLE:true}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"

agent:
  enabled: ${AGENT_ENABLED:false}
  cloud-execution-enabled: ${AGENT_CLOUD_EXECUTION_ENABLED:false}
  runtime-engine: ${AGENT_RUNTIME_ENGINE:KERNEL}
  run-concurrency: ${AGENT_RUN_CONCURRENCY:2}
  run-queue-capacity: ${AGENT_RUN_QUEUE_CAPACITY:32}
  recovery-batch-size: ${AGENT_RECOVERY_BATCH_SIZE:32}
  artifact-url-expiration-seconds: ${AGENT_ARTIFACT_URL_EXPIRATION_SECONDS:300}
  model:
    api-key: ${AGENT_MODEL_API_KEY:}
    base-url: ${AGENT_MODEL_BASE_URL:https://api.openai.com}

yudao:
  web:
    admin-ui:
      url: ${YUDAO_ADMIN_UI_URL:http://localhost:3000}
  pay:
    order-no-prefix: ${YUDAO_PAY_ORDER_NO_PREFIX:P}
    refund-no-prefix: ${YUDAO_PAY_REFUND_NO_PREFIX:R}
    transfer-no-prefix: ${YUDAO_PAY_TRANSFER_NO_PREFIX:T}
    transaction-no-prefix: ${YUDAO_PAY_TRANSACTION_NO_PREFIX:W}
    wallet-pay-app-key: ${YUDAO_PAY_WALLET_APP_KEY:wallet}
    order-notify-url: ${YUDAO_PAY_ORDER_NOTIFY_URL:http://127.0.0.1:48080/admin-api/pay/notify/order}
    refund-notify-url: ${YUDAO_PAY_REFUND_NOTIFY_URL:http://127.0.0.1:48080/admin-api/pay/notify/refund}
    transfer-notify-url: ${YUDAO_PAY_TRANSFER_NOTIFY_URL:http://127.0.0.1:48080/admin-api/pay/notify/transfer}
    max-notify-times: ${YUDAO_PAY_MAX_NOTIFY_TIMES:9}
  sync:
    change-retention-days: ${YUDAO_SYNC_CHANGE_RETENTION_DAYS:30}
    change-retention-batch-size: ${YUDAO_SYNC_CHANGE_RETENTION_BATCH_SIZE:1000}
    change-retention-max-batches: ${YUDAO_SYNC_CHANGE_RETENTION_MAX_BATCHES:20}
    change-retention-cron: "${YUDAO_SYNC_CHANGE_RETENTION_CRON:0 30 3 * * ?}"
    push:
      firebase:
        enabled: ${YUDAO_SYNC_PUSH_FIREBASE_ENABLED:false}
        credentials-location: ${YUDAO_SYNC_PUSH_FIREBASE_CREDENTIALS:}
        project-id: ${YUDAO_SYNC_PUSH_FIREBASE_PROJECT_ID:}
  xss:
    enable: ${YUDAO_XSS_ENABLE:false}
    exclude-urls:
      - ${spring.boot.admin.context-path:/admin}/**
      - ${management.endpoints.web.base-path:/actuator}/**
  api-encrypt:
    enable: ${YUDAO_API_ENCRYPT_ENABLE:true}
    algorithm: ${YUDAO_API_ENCRYPT_ALGORITHM:AES}
    request-key: ${YUDAO_API_ENCRYPT_REQUEST_KEY:52549111389893486934626385991395}
    response-key: ${YUDAO_API_ENCRYPT_RESPONSE_KEY:96103715984234343991809655248883}
  swagger:
    title: ${YUDAO_SWAGGER_TITLE:芋道快速开发平台}
    description: ${YUDAO_SWAGGER_DESCRIPTION:提供管理后台、用户 App 的所有功能}
    author: ${YUDAO_SWAGGER_AUTHOR:芋道源码}
    version: ${YUDAO_SWAGGER_VERSION:1.0.0}
    url: ${YUDAO_SWAGGER_URL:${yudao.web.admin-ui.url}}
    email: ${YUDAO_SWAGGER_EMAIL:xingyu4j@vip.qq.com}
    license: ${YUDAO_SWAGGER_LICENSE:MIT}
    license-url: ${YUDAO_SWAGGER_LICENSE_URL:https://gitee.com/zhijiantianya/ruoyi-vue-pro/blob/master/LICENSE}
  security:
    token-header: Authorization
    token-parameter: token
    mock-enable: ${YUDAO_SECURITY_MOCK_ENABLE:false}
    mock-secret: ${YUDAO_SECURITY_MOCK_SECRET:test}
    password-encoder-length: 10
    permit-all-urls: []
  websocket:
    enable: ${YUDAO_WEBSOCKET_ENABLE:true}
    path: /infra/ws
    sender-type: local
  tenant:
    enable: ${YUDAO_TENANT_ENABLE:true}
    ignore-urls:
      - ${spring.boot.admin.context-path:/admin}/**
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables: []
    ignore-caches: []
  codegen:
    base-package: im.hikaru.ruoyi
    db-schemas:
      - ${DB_SCHEMA:public}
    front-type: 20
    vo-type: 10
    delete-batch-enable: true
    unit-test-enable: false
    import-enable: false
  sms-code:
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 100000
    end-code: 999999

aj:
  captcha:
    cache-type: redis
    type: blockPuzzle
    req-frequency-limit-enable: false

logging:
  file:
    name: ${LOG_FILE:${user.home}/logs/${spring.application.name}.log}
  level:
    im.hikaru.ruoyi.module.infra.dal.mysql: info
    im.hikaru.ruoyi.module.system.dal.mysql: info
